.art{animation:art 2.2s ease-out backwards} @keyframes art{from{opacity:0}}
.bl{animation:bl 1.05s steps(1) infinite} @keyframes bl{50%{opacity:0}}
.eye{animation:eye 3s ease-in-out infinite} @keyframes eye{0%,100%{opacity:.35}50%{opacity:1}}
</style></defs>
